<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Regresiva de Cumpleaños ⏳🎉</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Outfit:wght@300;400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #0b0718;
            color: #ffffff;
            overflow-x: hidden;
        }

        .font-cursive {
            font-family: 'Dancing Script', cursive;
        }

        .font-pixel {
            font-family: 'Press Start 2P', monospace;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.5);
        }

        /* Glowing text effect */
        .glow-text {
            text-shadow: 0 0 15px rgba(236, 72, 153, 0.6), 0 0 30px rgba(168, 85, 247, 0.4);
        }

        .glow-gold {
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.7);
        }

        /* Countdown Card Flip / Pulse Effect */
        .time-box {
            background: rgba(15, 12, 32, 0.85);
            border: 1px solid rgba(244, 114, 182, 0.25);
            box-shadow: inset 0 0 15px rgba(236, 72, 153, 0.15);
        }

        /* Unlocked Button Neon Pulse */
        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(245, 158, 11, 0.6), 0 0 40px rgba(236, 72, 153, 0.4);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 35px rgba(245, 158, 11, 0.9), 0 0 60px rgba(236, 72, 153, 0.7);
                transform: scale(1.03);
            }
        }

        .unlocked-btn-anim {
            animation: pulseGlow 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative p-4 select-none bg-gradient-to-br from-slate-950 via-purple-950 to-slate-900">

    <!-- Canvas for Floating Particle Stars -->
    <canvas id="starCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <!-- Botón Flotante para Controlar la Música -->
    <div class="fixed top-4 right-4 z-50 flex items-center gap-2">
        <button id="musicToggleBtn" onclick="toggleMusic()" class="px-3 py-2 rounded-full bg-slate-900/80 border border-pink-500/30 text-pink-300 text-xs font-semibold backdrop-blur-md shadow-lg hover:bg-pink-950 transition flex items-center gap-2">
            <i id="musicBtnIcon" class="fa-solid fa-music"></i>
            <span id="musicBtnText">Música</span>
        </button>
        <button onclick="playRandomSong(true)" class="p-2 rounded-full bg-slate-900/80 border border-purple-500/30 text-purple-300 text-xs backdrop-blur-md shadow-lg hover:bg-purple-950 transition" title="Cambiar canción">
            <i class="fa-solid fa-shuffle"></i>
        </button>
    </div>

    <!-- Main Container -->
    <main class="relative z-10 w-full max-w-2xl mx-auto text-center flex flex-col items-center">

        <!-- Header Title -->
        <div class="mb-8 animate-fade-in">
            <span class="inline-block px-4 py-1.5 rounded-full bg-pink-500/20 border border-pink-500/30 text-pink-300 text-xs sm:text-sm font-semibold mb-3 tracking-widest uppercase">
                ⏳ Esperando el momento
            </span>
            <h1 class="text-3xl sm:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-pink-400 to-rose-300 font-cursive glow-text">
                Falta muy poco...
            </h1>
            <p class="text-slate-400 text-xs sm:text-base mt-2">
                El acceso se habilitará automáticamente el <span class="text-pink-300 font-semibold">26 de Octubre de 2026 a las 00:00 A.M.</span>
            </p>
        </div>

        <!-- COUNTDOWN TIMER DISPLAY -->
        <div class="grid grid-cols-4 gap-2 sm:gap-4 w-full max-w-lg mb-8">
            <!-- Days -->
            <div class="time-box rounded-2xl p-3 sm:p-5 flex flex-col items-center justify-center">
                <span id="days" class="text-2xl sm:text-5xl font-extrabold text-pink-400 font-mono">00</span>
                <span class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider mt-1">Días</span>
            </div>
            <!-- Hours -->
            <div class="time-box rounded-2xl p-3 sm:p-5 flex flex-col items-center justify-center">
                <span id="hours" class="text-2xl sm:text-5xl font-extrabold text-purple-300 font-mono">00</span>
                <span class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider mt-1">Horas</span>
            </div>
            <!-- Minutes -->
            <div class="time-box rounded-2xl p-3 sm:p-5 flex flex-col items-center justify-center">
                <span id="minutes" class="text-2xl sm:text-5xl font-extrabold text-sky-300 font-mono">00</span>
                <span class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider mt-1">Minutos</span>
            </div>
            <!-- Seconds -->
            <div class="time-box rounded-2xl p-3 sm:p-5 flex flex-col items-center justify-center">
                <span id="seconds" class="text-2xl sm:text-5xl font-extrabold text-amber-300 font-mono">00</span>
                <span class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider mt-1">Segundos</span>
            </div>
        </div>

        <!-- CARD STATUS & ACTION BUTTON -->
        <div class="glass-card w-full rounded-3xl p-6 sm:p-8 border border-white/10 relative overflow-hidden flex flex-col items-center">
            
            <!-- Lock / Unlock Status Icon -->
            <div id="statusIconBg" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-slate-800/80 border border-slate-700 flex items-center justify-center mb-4 transition-all duration-500 shadow-inner">
                <i id="statusIcon" class="fa-solid fa-lock text-slate-400 text-2xl sm:text-3xl transition-all duration-500"></i>
            </div>

            <!-- Dynamic Message -->
            <h2 id="statusTitle" class="text-lg sm:text-2xl font-bold text-slate-300 mb-1">
                Bloqueada
            </h2>
            <p id="statusDesc" class="text-xs sm:text-sm text-slate-400 mb-6 max-w-md">
                El botón se activará exactamente cuando el contador llegue a 00:00:00.
            </p>

            <!-- ACTION BUTTON LINK (Bloqueado por defecto) -->
            <a id="cardBtn" 
               href="javascript:void(0)" 
               class="w-full sm:w-auto px-8 py-4 rounded-full bg-slate-800 text-slate-500 font-extrabold text-sm sm:text-base border border-slate-700 cursor-not-allowed transition-all duration-500 flex items-center justify-center gap-3 shadow-lg">
                <i id="btnIcon" class="fa-solid fa-lock text-xs"></i>
                <span id="btnText">Abrir Carta</span>
            </a>

        </div>

        <!-- Dev Mode Testing Shortcut -->
        <div class="mt-8">
            <button onclick="simulateZeroTimer()" class="text-[1px] text-slate-500 hover:text-amber-400 underline transition flex items-center gap-1">
                <i class="fa-solid fa-vial"></i> 00:00:00
            </button>
        </div>

    </main>

    <!-- Elemento Reproductor de Audio -->
    <audio id="bgAudio" loop></audio>

    <script>
        /* ===================================================
           SISTEMA DE MÚSICA DE FONDO ALEATORIA
           =================================================== */
        // Agrega aquí los archivos o URLs de tus canciones
        const PLAYLIST = [
            "309.mp3",
            "INAROW62.mp3",
            "1000CANCIONES.mp3",
            "PLN.mp3",
            "tuffluv.mp3",
            "NOPODEMOSERAMIGOS.mp3",
            "MUBI.mp3",
            "BADINTENCIONES.mp3"
        ];

        const audioPlayer = document.getElementById('bgAudio');
        let isPlaying = false;

        function playRandomSong(forceChange = false) {
            if (!PLAYLIST || PLAYLIST.length === 0) return;

            const lastSong = sessionStorage.getItem('lastPlayedSong');
            let availableSongs = PLAYLIST;

            // Si hay más de una canción, filtra para no repetir la última reprodución
            if (PLAYLIST.length > 1 && lastSong && !forceChange) {
                availableSongs = PLAYLIST.filter(song => song !== lastSong);
            }

            const randomIndex = Math.floor(Math.random() * availableSongs.length);
            const selectedSong = availableSongs[randomIndex];

            sessionStorage.setItem('lastPlayedSong', selectedSong);
            audioPlayer.src = selectedSong;
            audioPlayer.volume = 0.3; // Volumen suave (30%)

            audioPlayer.play().then(() => {
                isPlaying = true;
                updateMusicUI();
            }).catch(() => {
                // Autoplay bloqueado hasta que el usuario interactúe con la pantalla
                isPlaying = false;
                updateMusicUI();
            });
        }

        function toggleMusic() {
            if (!audioPlayer.src) {
                playRandomSong();
                return;
            }

            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
            } else {
                audioPlayer.play().then(() => {
                    isPlaying = true;
                }).catch(e => console.log(e));
            }
            updateMusicUI();
        }

        function updateMusicUI() {
            const btnText = document.getElementById('musicBtnText');
            const btnIcon = document.getElementById('musicBtnIcon');
            if (isPlaying) {
                btnText.innerText = "Sonando 🎵";
                btnIcon.className = "fa-solid fa-pause text-pink-400 animate-pulse";
            } else {
                btnText.innerText = "Música";
                btnIcon.className = "fa-solid fa-music";
            }
        }

        // Intenta reproducir al cargar y ante el primer clic en el sitio
        window.addEventListener('DOMContentLoaded', () => playRandomSong());
        document.body.addEventListener('click', () => {
            if (!isPlaying && audioPlayer.src) {
                audioPlayer.play().then(() => {
                    isPlaying = true;
                    updateMusicUI();
                }).catch(() => {});
            }
        }, { once: true });


        /* ===================================================
           CONFIGURACIÓN DE FECHA OBJETIVO Y ARCHIVO HTML
           =================================================== */
        // Fecha objetivo: 26 de Octubre de 2026, 00:00:00 A.M.
        const TARGET_DATE = new Date("October 26, 2026 00:00:00").getTime();
        
        // Nombre del archivo HTML de tu carta
        const URL_CARTA_DESTINO = "carta.html";

        let timerInterval = null;
        let isUnlocked = false;

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = TARGET_DATE - now;

            if (difference <= 0) {
                // El tiempo expiró / llegó a 00:00:00
                clearInterval(timerInterval);
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                
                unlockButton();
                return;
            }

            // Cálculos de tiempo restante
            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(d).padStart(2, '0');
            document.getElementById('hours').innerText = String(h).padStart(2, '0');
            document.getElementById('minutes').innerText = String(m).padStart(2, '0');
            document.getElementById('seconds').innerText = String(s).padStart(2, '0');
        }

        function unlockButton() {
            if (isUnlocked) return;
            isUnlocked = true;

            const cardBtn = document.getElementById('cardBtn');
            const btnIcon = document.getElementById('btnIcon');
            const btnText = document.getElementById('btnText');
            const statusIcon = document.getElementById('statusIcon');
            const statusIconBg = document.getElementById('statusIconBg');
            const statusTitle = document.getElementById('statusTitle');
            const statusDesc = document.getElementById('statusDesc');

            // Asignar el enlace real del otro archivo HTML
            cardBtn.href = URL_CARTA_DESTINO;
            cardBtn.classList.remove('bg-slate-800', 'text-slate-500', 'border-slate-700', 'cursor-not-allowed');
            cardBtn.classList.add('bg-gradient-to-r', 'from-amber-400', 'via-pink-500', 'to-yellow-400', 'text-slate-950', 'border-amber-300', 'hover:opacity-95', 'unlocked-btn-anim');

            btnIcon.className = "fa-solid fa-gift text-base animate-bounce";
            btnText.innerText = "¡ABRIR MI CARTA SORPRESA!";

            statusIconBg.className = "w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-pink-500/20 border-2 border-pink-400 flex items-center justify-center mb-4 shadow-[0_0_25px_rgba(236,72,153,0.5)]";
            statusIcon.className = "fa-solid fa-envelope-open-text text-pink-300 text-2xl sm:text-3xl animate-pulse";

            statusTitle.className = "text-lg sm:text-2xl font-bold text-amber-300 glow-gold mb-1";
            statusTitle.innerText = "¡¡¡LLEGUÓ EL MOMENTO!!! 🎉✨";

            statusDesc.className = "text-xs sm:text-sm text-pink-200 mb-6 max-w-md font-medium";
            statusDesc.innerText = "Tu regalo especial ya está listo. Haz clic en el botón de abajo para abrir la carta.";
        }

        function simulateZeroTimer() {
            clearInterval(timerInterval);
            document.getElementById('days').innerText = "00";
            document.getElementById('hours').innerText = "00";
            document.getElementById('minutes').innerText = "00";
            document.getElementById('seconds').innerText = "00";
            unlockButton();
        }

        // Iniciar el temporizador
        timerInterval = setInterval(updateCountdown, 1000);
        updateCountdown();

        /* ===================================================
           CANVAS DE ESTRELLAS FLOTANTES (Fondo)
           =================================================== */
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function initStars() {
            resizeCanvas();
            stars = [];
            for (let i = 0; i < 70; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.4 + 0.1
                });
            }
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "white";

            stars.forEach(s => {
                ctx.globalAlpha = s.alpha;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();

                s.y -= s.speed;
                if (s.y < 0) {
                    s.y = canvas.height;
                    s.x = Math.random() * canvas.width;
                }
            });

            requestAnimationFrame(animateStars);
        }

        initStars();
        animateStars();
    </script>
</body>
</html>
